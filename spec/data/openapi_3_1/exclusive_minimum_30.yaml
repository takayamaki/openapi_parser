openapi: 3.0.3
info:
  title: Membership API
  version: '1.0'
paths:
  /members:
    post:
      summary: Register a member
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Member'
      responses:
        '201':
          description: Created
components:
  schemas:
    Member:
      type: object
      properties:
        # 3.1 form: a bare numeric exclusive bound. In 3.0 the exclusive
        # bound is expressed as `minimum: 0` paired with `exclusiveMinimum: true`,
        # so this numeric value is a spec violation on a 3.0 document.
        age:
          type: integer
          exclusiveMinimum: 0
