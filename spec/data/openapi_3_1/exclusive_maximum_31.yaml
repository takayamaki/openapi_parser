openapi: 3.1.0
info:
  title: Pricing API
  version: '1.0'
paths:
  /quotes:
    post:
      summary: Request a price quote
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quote'
      responses:
        '201':
          description: Created
components:
  schemas:
    Quote:
      type: object
      properties:
        # 3.1 form: a bare numeric exclusive bound is legitimate under 3.1,
        # so no violation is expected here.
        discountPercent:
          type: number
          exclusiveMaximum: 100
